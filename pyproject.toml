[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exosphere"
version = "0.1.0"
description = "Exoplanet atmospheric characterization platform (JWST transmission spectroscopy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "astropy==7.1.0",
    "pandas==2.2.3",
    "pydantic==2.11.7",
    "pytest==8.4.1",
    "ruff==0.11.13",
    "astroquery==0.4.11",
    "requests==2.32.5",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "torch==2.14.1",
    "scikit-learn==1.9.1",
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "sqlalchemy==2.0.36",
    "alembic==1.13.2",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "jinja2==3.1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = [
    "network: hits live network services; run with `pytest -m network`",
    "slow: marks tests as slow; run with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

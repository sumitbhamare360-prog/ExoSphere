[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exosphere"
version = "0.1.0"
description = "Exoplanet atmospheric characterization platform (JWST transmission spectroscopy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "astropy==7.1.0",
    "pandas==2.2.3",
    "pydantic==2.11.7",
    "pytest==8.4.1",
    "ruff==0.11.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

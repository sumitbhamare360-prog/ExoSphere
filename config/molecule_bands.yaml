# ExoSphere molecule absorption bands + data-quality thresholds (Phase 2).
#
# Band windows (um) are the main retrieval-sensitive absorption features of the
# V1 molecule set inside the JWST/NIRSpec PRISM range 0.6-5.3 um (AGENTS.md
# section 2). Windows follow the standard band origins used in the WASP-39 b
# JWST retrieval literature (Rustamkulov 2023, Feinstein 2023, Alderson 2023):
#   H2O  - nu2/near-IR combination & overtone bands (0.94, 1.1, 1.4, 1.9, 2.7)
#   CO2  - 2.0 combination, 2.7 (nu1+nu3), 4.3 (strong nu3 fundamental)
#   CO   - 2.3 first overtone, 4.7 fundamental
#   CH4  - 1.6, 2.3, 3.3 (nu3) bands
#   SO2  - 3.9-4.2 combination window (the 7.7 nu3 fundamental lies beyond 5.3 um)
# Windows are deliberately broad enough to capture band wings at PRISM
# resolution; the data-quality module only uses them for coverage/S-N ratings,
# never for abundance inference.

version: "molecule-bands-1.0.0"

# Nominal V1 wavelength span used for the overall coverage fraction.
wavelength_range_um: [0.6, 5.3]

molecules:
  H2O:
    - [0.93, 0.98]
    - [1.1, 1.2]
    - [1.3, 1.5]
    - [1.8, 2.0]
    - [2.6, 3.1]
  CO2:
    - [2.0, 2.1]
    - [2.7, 2.8]
    - [4.2, 4.4]
  CO:
    - [2.3, 2.4]
    - [4.5, 4.9]
  CH4:
    - [1.6, 1.8]
    - [2.2, 2.4]
    - [3.2, 3.5]
  SO2:
    - [3.9, 4.2]

# ---------------------------------------------------------------------------
# Data-quality thresholds. Every number here is logged in DECISIONS.md.
# ---------------------------------------------------------------------------
quality:
  # Running-median window (points, forced odd) used to estimate the local
  # continuum for S/N and outlier detection.
  continuum_window_points: 21
  # Robust MAD sigma-clip threshold (outliers = |standardized residual| beyond
  # this many robust sigmas of the local-continuum residuals).
  outlier_n_sigma: 5.0

  # Overall suitability metrics; a metric maps to GOOD/LIMITED/POOR and the
  # overall rating is the worst metric.
  overall:
    wavelength_coverage_good: 0.7   # >= fraction of the nominal range usable
    wavelength_coverage_poor: 0.4
    # S/N metric for suitability = best (highest) per-band S/N, i.e. does any
    # molecule window show structure clearly above the local noise?
    snr_good: 5.0
    snr_poor: 2.0
    bad_point_fraction_good: 0.1     # flagged + NaN fraction
    bad_point_fraction_poor: 0.5
    outlier_fraction_good: 0.05
    outlier_fraction_poor: 0.25
    min_points_good: 50
    min_points_poor: 10

  # Per-molecule rating from band coverage + in-band S/N (see DECISIONS.md:
  # the rating measures data capability in the molecule's windows - coverage +
  # spectral structure above noise - NOT molecule presence, which only the
  # retrieval can decide).
  molecule:
    coverage_good: 0.6     # >= fraction of the molecule's band windows covered
    coverage_limited: 0.3  # below -> POOR
    snr_good: 5.0          # in-band S/N (90th pct of point S/N) >= 5 -> GOOD
    snr_limited: 2.0       # below -> POOR
    min_points_good: 5     # usable points inside the band windows
    min_points_limited: 1  # below -> POOR

  # Uncertainty sanity in fractional transit depth.
  uncertainty:
    max_frac_of_depth: 0.1 # sigma > 10% of the median depth is "huge"
    min_fractional: 1.0e-10  # sigma below 1e-4 ppm is implausibly tiny
